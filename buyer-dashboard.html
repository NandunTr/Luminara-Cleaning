<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Dashboard — Luminara Cleanings</title>
  <link rel="stylesheet" href="shared.css" />
  <link rel="stylesheet" href="buyer-dashboard.css" />
</head>
<body>
  <div class="dashboard-layout">
    <!-- Sidebar Overlay (mobile) -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <img src="logo.png" alt="Luminara" class="sidebar-logo" />
        <div class="sidebar-brand">
          <h2>Luminara</h2>
          <span>Customer Portal</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="sidebar-nav-label">Menu</div>
        <button class="sidebar-nav-item active" data-panel="overview" id="nav-overview">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 0 1 6 3.75h2.25A2.25 2.25 0 0 1 10.5 6v2.25a2.25 2.25 0 0 1-2.25 2.25H6a2.25 2.25 0 0 1-2.25-2.25V6ZM3.75 15.75A2.25 2.25 0 0 1 6 13.5h2.25a2.25 2.25 0 0 1 2.25 2.25V18a2.25 2.25 0 0 1-2.25 2.25H6A2.25 2.25 0 0 1 3.75 18v-2.25ZM13.5 6a2.25 2.25 0 0 1 2.25-2.25H18A2.25 2.25 0 0 1 20.25 6v2.25A2.25 2.25 0 0 1 18 10.5h-2.25a2.25 2.25 0 0 1-2.25-2.25V6ZM13.5 15.75a2.25 2.25 0 0 1 2.25-2.25H18a2.25 2.25 0 0 1 2.25 2.25V18A2.25 2.25 0 0 1 18 20.25h-2.25a2.25 2.25 0 0 1-2.25-2.25v-2.25Z" /></svg>
          Dashboard
        </button>
        <button class="sidebar-nav-item" data-panel="bookings" id="nav-bookings">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5" /></svg>
          My Bookings
          <span class="nav-badge" id="bookings-count" style="display:none;">0</span>
        </button>
        <button class="sidebar-nav-item" data-panel="new-booking" id="nav-new-booking">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" /></svg>
          Book New Cleaning
        </button>

        <div class="sidebar-nav-label">Account</div>
        <button class="sidebar-nav-item" data-panel="profile" id="nav-profile">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" /></svg>
          My Profile
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="sidebar-avatar" id="sidebar-avatar">?</div>
          <div class="sidebar-user-info">
            <div class="name" id="sidebar-user-name">Loading...</div>
            <div class="role">Customer</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Header -->
      <header class="dashboard-header">
        <div class="dashboard-header-left">
          <button class="mobile-menu-toggle" id="mobile-menu-toggle">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" /></svg>
          </button>
          <h1 id="page-title">Dashboard</h1>
        </div>
        <div class="dashboard-header-right">
          <a href="index.html" class="header-btn" title="Back to Website">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" /></svg>
          </a>
          <button class="header-logout-btn" id="logout-btn">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 0 3-3m0 0-3-3m3 3H9" /></svg>
            Logout
          </button>
        </div>
      </header>

      <div class="dashboard-content">
        <!-- ═══ OVERVIEW PANEL ═══ -->
        <div class="dashboard-panel active" id="panel-overview">
          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-icon green">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5" /></svg>
              </div>
              <div class="stat-info">
                <h3>Total Bookings</h3>
                <div class="stat-value" id="stat-total">0</div>
              </div>
            </div>
            <div class="stat-card">
              <div class="stat-icon gold">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" /></svg>
              </div>
              <div class="stat-info">
                <h3>Active</h3>
                <div class="stat-value" id="stat-active">0</div>
              </div>
            </div>
            <div class="stat-card">
              <div class="stat-icon blue">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" /></svg>
              </div>
              <div class="stat-info">
                <h3>Completed</h3>
                <div class="stat-value" id="stat-completed">0</div>
              </div>
            </div>
          </div>

          <!-- Recent Bookings -->
          <div class="content-card">
            <div class="content-card-header">
              <h2>Recent Bookings</h2>
              <button class="btn-dashboard btn-secondary-d btn-sm-d" onclick="switchPanel('bookings')">View All</button>
            </div>
            <div class="content-card-body" id="recent-bookings-body">
              <div class="loading-spinner"><div class="spinner"></div></div>
            </div>
          </div>
        </div>

        <!-- ═══ MY BOOKINGS PANEL ═══ -->
        <div class="dashboard-panel" id="panel-bookings">
          <div class="content-card">
            <div class="content-card-header">
              <h2>All My Bookings</h2>
            </div>
            <div class="content-card-body" id="all-bookings-body">
              <div class="loading-spinner"><div class="spinner"></div></div>
            </div>
          </div>
        </div>

        <!-- ═══ NEW BOOKING PANEL ═══ -->
        <div class="dashboard-panel" id="panel-new-booking">
          <div class="content-card">
            <div class="content-card-header">
              <h2>Book a New Cleaning</h2>
            </div>
            <div class="content-card-body">
              <form id="dashboard-booking-form" style="max-width:600px;">
                <div class="form-row-d">
                  <div class="form-group-d">
                    <label for="db-service-type">Service Type</label>
                    <select id="db-service-type" required>
                      <option value="" disabled selected>Select service</option>
                      <option value="residential">Residential Cleaning</option>
                      <option value="commercial">Commercial & Office</option>
                      <option value="specialized">Specialized Services</option>
                    </select>
                  </div>
                  <div class="form-group-d">
                    <label for="db-property-type">Property Type</label>
                    <select id="db-property-type" required>
                      <option value="" disabled selected>Select property</option>
                      <option value="house">House</option>
                      <option value="apartment">Apartment</option>
                      <option value="office">Office</option>
                      <option value="retail">Retail Space</option>
                      <option value="other">Other</option>
                    </select>
                  </div>
                </div>
                <div class="form-row-d">
                  <div class="form-group-d">
                    <label for="db-date">Preferred Date</label>
                    <input type="date" id="db-date" required />
                  </div>
                  <div class="form-group-d">
                    <label for="db-time">Preferred Time</label>
                    <input type="time" id="db-time" required />
                  </div>
                </div>
                <div class="form-row-d">
                  <div class="form-group-d">
                    <label for="db-employees">Cleaners Needed</label>
                    <select id="db-employees">
                      <option value="2" selected>2 Cleaners</option>
                      <option value="1">1 Cleaner</option>
                      <option value="3">3 Cleaners</option>
                      <option value="4">4 Cleaners</option>
                      <option value="5">5+ Cleaners</option>
                    </select>
                  </div>
                  <div class="form-group-d">
                    <label>&nbsp;</label>
                  </div>
                </div>
                <div class="form-group-d">
                  <label for="db-address">Address</label>
                  <input type="text" id="db-address" placeholder="123 Main Street, Suite 200" required />
                </div>
                <div class="form-group-d">
                  <label for="db-notes">Additional Notes</label>
                  <textarea id="db-notes" rows="3" placeholder="Any special requests..."></textarea>
                </div>
                <button type="submit" class="btn-dashboard btn-primary-d" style="width:100%;padding:14px;">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" /></svg>
                  Submit Booking Request
                </button>
              </form>
            </div>
          </div>
        </div>

        <!-- ═══ PROFILE PANEL ═══ -->
        <div class="dashboard-panel" id="panel-profile">
          <div class="content-card">
            <div class="content-card-header">
              <h2>My Profile</h2>
            </div>
            <div class="content-card-body">
              <form id="profile-form" style="max-width:500px;">
                <div class="form-group-d">
                  <label for="profile-name">Full Name</label>
                  <input type="text" id="profile-name" />
                </div>
                <div class="form-group-d">
                  <label for="profile-email">Email</label>
                  <input type="email" id="profile-email" disabled style="opacity:0.6;" />
                </div>
                <div class="form-group-d">
                  <label for="profile-phone">Phone</label>
                  <input type="tel" id="profile-phone" />
                </div>
                <button type="submit" class="btn-dashboard btn-primary-d">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" /></svg>
                  Save Changes
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="buyer-dashboard.js"></script>
</body>
</html>
