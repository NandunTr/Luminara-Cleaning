<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard — Luminara Cleanings</title>
  <link rel="stylesheet" href="shared.css" />
  <link rel="stylesheet" href="admin-dashboard.css" />
</head>
<body>
  <div class="dashboard-layout">
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <img src="logo.png" alt="Luminara" class="sidebar-logo" />
        <div class="sidebar-brand">
          <h2>Luminara</h2>
          <span>Admin Panel</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="sidebar-nav-label">Management</div>
        <button class="sidebar-nav-item active" data-panel="overview" id="nav-overview">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 0 1 6 3.75h2.25A2.25 2.25 0 0 1 10.5 6v2.25a2.25 2.25 0 0 1-2.25 2.25H6a2.25 2.25 0 0 1-2.25-2.25V6ZM3.75 15.75A2.25 2.25 0 0 1 6 13.5h2.25a2.25 2.25 0 0 1 2.25 2.25V18a2.25 2.25 0 0 1-2.25 2.25H6A2.25 2.25 0 0 1 3.75 18v-2.25ZM13.5 6a2.25 2.25 0 0 1 2.25-2.25H18A2.25 2.25 0 0 1 20.25 6v2.25A2.25 2.25 0 0 1 18 10.5h-2.25a2.25 2.25 0 0 1-2.25-2.25V6ZM13.5 15.75a2.25 2.25 0 0 1 2.25-2.25H18a2.25 2.25 0 0 1 2.25 2.25V18A2.25 2.25 0 0 1 18 20.25h-2.25a2.25 2.25 0 0 1-2.25-2.25v-2.25Z" /></svg>
          Dashboard
        </button>
        <button class="sidebar-nav-item" data-panel="bookings" id="nav-bookings">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 0 0 2.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 0 0-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75 2.25 2.25 0 0 0-.1-.664m-5.8 0A2.251 2.251 0 0 1 13.5 2.25H15a2.25 2.25 0 0 1 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25ZM6.75 12h.008v.008H6.75V12Zm0 3h.008v.008H6.75V15Zm0 3h.008v.008H6.75V18Z" /></svg>
          All Bookings
          <span class="nav-badge" id="pending-count" style="display:none;">0</span>
        </button>
        <button class="sidebar-nav-item" data-panel="employees" id="nav-employees">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 0 0 2.625.372 9.337 9.337 0 0 0 4.121-.952 4.125 4.125 0 0 0-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 0 1 8.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0 1 11.964-3.07M12 6.375a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0Zm8.25 2.25a2.625 2.625 0 1 1-5.25 0 2.625 2.625 0 0 1 5.25 0Z" /></svg>
          Manage Employees
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="sidebar-avatar" id="sidebar-avatar">A</div>
          <div class="sidebar-user-info">
            <div class="name" id="sidebar-user-name">Admin</div>
            <div class="role">Administrator</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="dashboard-header">
        <div class="dashboard-header-left">
          <button class="mobile-menu-toggle" id="mobile-menu-toggle">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" /></svg>
          </button>
          <h1 id="page-title">Admin Dashboard</h1>
        </div>
        <div class="dashboard-header-right">
          <a href="index.html" class="header-btn" title="Back to Website">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" /></svg>
          </a>
          <button class="header-logout-btn" id="logout-btn">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 0 3-3m0 0-3-3m3 3H9" /></svg>
            Logout
          </button>
        </div>
      </header>

      <div class="dashboard-content">
        <!-- ═══ OVERVIEW ═══ -->
        <div class="dashboard-panel active" id="panel-overview">
          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-icon green"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5" /></svg></div>
              <div class="stat-info"><h3>Total Bookings</h3><div class="stat-value" id="stat-total">0</div></div>
            </div>
            <div class="stat-card">
              <div class="stat-icon gold"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" /></svg></div>
              <div class="stat-info"><h3>Pending</h3><div class="stat-value" id="stat-pending">0</div></div>
            </div>
            <div class="stat-card">
              <div class="stat-icon blue"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 0 0 2.625.372 9.337 9.337 0 0 0 4.121-.952 4.125 4.125 0 0 0-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 0 1 8.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0 1 11.964-3.07M12 6.375a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0Zm8.25 2.25a2.625 2.625 0 1 1-5.25 0 2.625 2.625 0 0 1 5.25 0Z" /></svg></div>
              <div class="stat-info"><h3>Employees</h3><div class="stat-value" id="stat-employees">0</div></div>
            </div>
            <div class="stat-card">
              <div class="stat-icon red"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" /></svg></div>
              <div class="stat-info"><h3>Completed</h3><div class="stat-value" id="stat-completed">0</div></div>
            </div>
          </div>

          <div class="content-card">
            <div class="content-card-header">
              <h2>Recent Bookings</h2>
              <button class="btn-dashboard btn-secondary-d btn-sm-d" onclick="switchPanel('bookings')">View All</button>
            </div>
            <div class="content-card-body" id="recent-bookings-body">
              <div class="loading-spinner"><div class="spinner"></div></div>
            </div>
          </div>
        </div>

        <!-- ═══ ALL BOOKINGS ═══ -->
        <div class="dashboard-panel" id="panel-bookings">
          <div class="content-card">
            <div class="content-card-header">
              <h2>All Bookings / Projects</h2>
            </div>
            <div class="content-card-body" id="all-bookings-body">
              <div class="loading-spinner"><div class="spinner"></div></div>
            </div>
          </div>
        </div>

        <!-- ═══ MANAGE EMPLOYEES ═══ -->
        <div class="dashboard-panel" id="panel-employees">
          <div class="content-card">
            <div class="content-card-header">
              <h2>Employees</h2>
              <button class="btn-dashboard btn-primary-d btn-sm-d" id="add-employee-btn">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" /></svg>
                Add Employee
              </button>
            </div>
            <div class="content-card-body" id="employees-body">
              <div class="loading-spinner"><div class="spinner"></div></div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Add Employee Modal -->
  <div class="modal-overlay" id="add-employee-modal">
    <div class="modal">
      <div class="modal-header">
        <h2>Add New Employee</h2>
        <button class="modal-close" onclick="document.getElementById('add-employee-modal').classList.remove('show')">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" /></svg>
        </button>
      </div>
      <div class="modal-body">
        <form id="add-employee-form">
          <div class="form-group-d">
            <label for="emp-name">Full Name</label>
            <input type="text" id="emp-name" placeholder="Employee name" required />
          </div>
          <div class="form-group-d">
            <label for="emp-email">Email</label>
            <input type="email" id="emp-email" placeholder="employee@email.com" required />
          </div>
          <div class="form-group-d">
            <label for="emp-phone">Phone</label>
            <input type="tel" id="emp-phone" placeholder="+1 (555) 123-4567" />
          </div>
          <div class="form-group-d">
            <label for="emp-password">Temporary Password</label>
            <input type="text" id="emp-password" placeholder="Min 6 characters" required minlength="6" />
          </div>
          <div class="form-group-d">
            <label for="emp-specialization">Specialization</label>
            <select id="emp-specialization">
              <option value="general">General Cleaning</option>
              <option value="residential">Residential</option>
              <option value="commercial">Commercial</option>
              <option value="specialized">Specialized</option>
            </select>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn-dashboard btn-secondary-d" onclick="document.getElementById('add-employee-modal').classList.remove('show')">Cancel</button>
        <button class="btn-dashboard btn-primary-d" id="confirm-add-employee">Add Employee</button>
      </div>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="admin-dashboard.js"></script>
</body>
</html>
